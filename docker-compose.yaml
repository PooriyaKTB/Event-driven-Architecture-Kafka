version: '3.8'

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      #Roles & node id
      # instead of KAFKA_BROKER_ID
      KAFKA_NODE_ID: 1
      # Single-node dev, so this node will play both roles, Colocated Mode
      KAFKA_PROCESS_ROLES: broker,controller

      # Protocols
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # KAFKA_CONTROLLER_QUORUM_VOTERS: <node_id>@<host>:<port>
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # Listeners (0.0.0.0 Internal (inside Container))
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # when handshake done(client connect for first time, broker sent back a connection address), client will send data to this address
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      # Node configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Configure 2 partition
      KAFKA_NUM_PARTITIONS: 2